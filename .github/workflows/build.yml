name: Build YAEC

# Ogni push compila il programma su Windows e lo prova su Linux con Mono.
# La versione sta nel file VERSION: quando su main arriva una versione che non ha
# ancora la sua release (tag vX.Y), la crea con l'installatore per Windows e i
# pacchetti per Linux e macOS.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      articolo:
        description: 'Schermate per gli articoli'
        type: boolean
        default: false
      aggiungi_pacchetti:
        description: 'Aggiunge alla release gia esistente (tag vVERSION) i pacchetti che le mancano'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        id: ver
        shell: bash
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Compila YAEC.exe (csc di .NET Framework 4, C# 5)
        shell: cmd
        run: |
          call build.cmd || exit /b 1
          mkdir x86
          call build.cmd x86 x86\YAEC.exe || exit /b 1
      - name: Installatore (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" YAEC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DExeDir=x86" "/DSuffisso=-32bit" YAEC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pacchetto portatile e sorgenti
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item "YAEC-$v-Setup.exe" "dist/YAEC-$v-win-x64-setup.exe"
          Move-Item "YAEC-$v-Setup-32bit.exe" "dist/YAEC-$v-win-x86-setup.exe"
          New-Item -ItemType Directory -Force p32 | Out-Null
          Copy-Item x86/YAEC.exe, YAEC.ico, README.txt, LICENZA.txt -Destination p32/
          Copy-Item -Recurse lingue p32/
          Compress-Archive -Path p32/* -DestinationPath "dist/YAEC-$v-win-x86-portatile.zip"
          Compress-Archive -Path YAEC.exe, YAEC.ico, README.txt, LICENZA.txt, lingue -DestinationPath "dist/YAEC-$v-win-x64-portatile.zip"
          Compress-Archive -Path YAEC.cs, compila.bat, YAEC.manifest, YAEC.ico, README.txt, YAEC.iss, LICENZA.txt, lingue -DestinationPath "dist/YAEC-$v-source.zip"
          # Windows su ARM64 (PC con Snapdragon): YAEC.exe e' AnyCPU, con .NET Framework 4.8.1 gira nativo su ARM64
          Copy-Item "dist/YAEC-$v-win-x64-setup.exe" "dist/YAEC-$v-win-arm64-setup.exe"
          Copy-Item "dist/YAEC-$v-win-x64-portatile.zip" "dist/YAEC-$v-win-arm64-portatile.zip"
          Copy-Item YAEC.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: win
      - name: Versione
        id: ver
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Verifica delle fonti di CALL3.TXT (solo informativa)
        continue-on-error: true
        run: |
          for u in "http://www.bigskyspaces.com/w7gj/CALL3.TXT" "http://www.bigskyspaces.com/w7gj/call3.txt" \
                   "https://downloads.sourceforge.net/project/wsjt-x-improved/Additional%20Files/CALL3.TXT" \
                   "https://sourceforge.net/projects/wsjt-x-improved/files/Additional%20Files/CALL3.TXT/download"; do
            code=$(curl -sSL -A "YAEC-CI" -m 30 -o c3.tmp -w "%{http_code}" "$u" || echo ERR)
            echo "CALL3 $code $(wc -c < c3.tmp 2>/dev/null) bytes, righe valide $(grep -cE '^[A-Z0-9/]+,[A-R]{2}[0-9]{2}' c3.tmp 2>/dev/null) :: $u"
            head -c 300 c3.tmp | tr -d '\r' | head -4; echo
          done
          curl -sSL -m 30 http://www.bigskyspaces.com/w7gj/ | grep -io 'href="[^"]*call3[^"]*"' | head || true
          curl -sSL -m 30 http://www.bigskyspaces.com/w7gj/tracker.htm | grep -io 'href="[^"]*\.txt"' | head || true
      - name: Pacchetti .deb, .rpm e .tar.gz
        run: |
          sudo apt-get install -y -qq rpm > /dev/null
          cp win/YAEC.exe .
          packaging/linux/build-linux.sh "${{ steps.ver.outputs.version }}" dist
          ls dist/*.rpm dist/*_armhf.deb > /dev/null
          rpm -qpi dist/*.rpm; rpm -qpl dist/*.rpm | head -20
      - name: Prova del .rpm su openSUSE e Fedora (solo informativa)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD/dist:/d" opensuse/leap:15.6 sh -c 'zypper -q --non-interactive --no-gpg-checks install /d/*.noarch.rpm && rpm -q yaec && test -f /usr/lib/yaec/YAEC.exe && echo "openSUSE: rpm installato"' || echo "openSUSE: installazione non riuscita"
          docker run --rm -v "$PWD/dist:/d" fedora:latest sh -c 'dnf -q -y install /d/*.noarch.rpm && rpm -q yaec && echo "Fedora: rpm installato"' || echo "Fedora: installazione non riuscita"
      - name: Prova di avvio con Mono (schermo virtuale Xvfb) e schermata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-runtime libmono-system-windows-forms4.0-cil libmono-system-web-extensions4.0-cil libmono-system-security4.0-cil libmono-system-io-compression-filesystem4.0-cil libgdiplus xvfb imagemagick fonts-dejavu-core > /dev/null
          # impostazioni di prova: stazione IC8TEM a Capri e un DX, lingua italiana
          mkdir -p "$HOME/.local/share/YAEC/data"
          printf 'lingua=it\nlocator=JN70CN83CL\ndx=1\ndx_locator=BL20BB\ndx_nominativo=W7GJ\n' > "$HOME/.local/share/YAEC/data/impostazioni.txt"
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99
          sleep 2
          mono YAEC.exe &
          PID=$!
          sleep 90
          mkdir -p shot
          import -window root shot/YAEC-linux-mono.png || true
          convert shot/YAEC-linux-mono.png -resize 1200x shot/small.jpg 2>/dev/null && echo "SCREENSHOT-B64:$(base64 -w 0 shot/small.jpg)" || true
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
          if kill -0 $PID 2>/dev/null; then echo "YAEC in esecuzione dopo 90 s: avvio riuscito"; kill $PID; else echo "YAEC si e' chiuso"; exit 1; fi
          # seconda schermata: linguetta Distanza e Dgrd (e CALL3.TXT ormai scaricato)
          ls -la "$HOME/.local/share/YAEC/data" || true
          apt-cache search mono | grep -iE "cert|mono-devel|mono-complete" | head || true
          which cert-sync mozroots || true
          mono --version | head -1 || true
          head -c 200 "$HOME/.local/share/YAEC/data/solar-radio-flux.json" 2>/dev/null || echo "solar-radio-flux.json assente"; echo
          head -5 "$HOME/.local/share/YAEC/data/CALL3.TXT" 2>/dev/null || true
          YAEC_LINGUETTA="Distanza e Dgrd" mono YAEC.exe &
          PID=$!
          sleep 40
          import -window root shot/YAEC-dgrd.png || true
          convert shot/YAEC-dgrd.png -resize 1200x shot/small2.jpg 2>/dev/null && echo "SCREENSHOT2-B64:$(base64 -w 0 shot/small2.jpg)" || true
          kill $PID 2>/dev/null || true
          # terza schermata: TEORIA E CONSIGLI SULL'EME (prefazione e numerazione)
          YAEC_LINGUETTA="TEORIA E CONSIGLI SULL'EME" mono YAEC.exe &
          PID=$!
          sleep 35
          import -window root shot/YAEC-teoria.png || true
          convert shot/YAEC-teoria.png -resize 1200x shot/small3.jpg 2>/dev/null && echo "SCREENSHOT3-B64:$(base64 -w 0 shot/small3.jpg)" || true
          kill $PID 2>/dev/null || true
          # Bilan EME in francese (testi lunghi nello schema dell'impianto)
          sed -i 's/^lingua=it/lingua=fr/' "$HOME/.local/share/YAEC/data/impostazioni.txt"
          YAEC_LINGUETTA="Bilan EME" mono YAEC.exe &
          PID=$!
          sleep 30
          import -window root shot/fr.png || true
          convert shot/fr.png -resize 1200x shot/fr.jpg 2>/dev/null && echo "SCREENSHOT-FR-B64:$(base64 -w 0 shot/fr.jpg)" || true
          kill $PID 2>/dev/null || true
          sed -i 's/^lingua=fr/lingua=es/' "$HOME/.local/share/YAEC/data/impostazioni.txt"
          YAEC_LINGUETTA="TEORÍA Y CONSEJOS SOBRE EME" mono YAEC.exe &
          PID=$!
          sleep 30
          import -window root shot/es.png || true
          convert shot/es.png -resize 1200x shot/es.jpg 2>/dev/null && echo "SCREENSHOT-ES-B64:$(base64 -w 0 shot/es.jpg)" || true
          kill $PID 2>/dev/null || true
          sed -i 's/^lingua=es/lingua=it/' "$HOME/.local/share/YAEC/data/impostazioni.txt"
          for C in "Verificare il puntamento con il radar GRAVES" "Le impostazioni di NJ9R per JT65B" "Le chat testuali via Internet"; do
            YAEC_LINGUETTA="TEORIA E CONSIGLI SULL'EME" YAEC_CERCA="$C" mono YAEC.exe &
            PID=$!
            sleep 30
            import -window root shot/c.png || true
            convert shot/c.png -resize 1200x shot/c.jpg 2>/dev/null && echo "SCREENSHOT-CERCA-B64:$(base64 -w 0 shot/c.jpg)" || true
            kill $PID 2>/dev/null || true
          done
          echo "tema=pastello-azzurro" >> "$HOME/.local/share/YAEC/data/impostazioni.txt"
          YAEC_LINGUETTA="CONTATTI DELL'AUTORE E RINGRAZIAMENTI" YAEC_FONDO=1 mono YAEC.exe &
          PID=$!
          sleep 30
          import -window root shot/f.png || true
          convert shot/f.png -resize 1200x shot/f.jpg 2>/dev/null && echo "SCREENSHOT-FONDO-B64:$(base64 -w 0 shot/f.jpg)" || true
          kill $PID 2>/dev/null || true
          for T in "Budget EME yagi" "Budget EME dischi" "Ricognizione dei miei ostacoli" "Controllo dei calcoli" "Distanza e Dgrd" "Posizione della Luna" "Radar GRAVES" "DGRD per frequenza"; do
            YAEC_LINGUETTA="$T" mono YAEC.exe &
            PID=$!
            sleep 30
            import -window root shot/x.png || true
            convert shot/x.png -resize 1200x shot/x.jpg 2>/dev/null && echo "SCREENSHOT-${T// /_}-B64:$(base64 -w 0 shot/x.jpg)" || true
            kill $PID 2>/dev/null || true
          done
          # Il mio orizzonte: orizzonte dal terreno calcolato (raggio 100 km per fare presto), poi la mappa del rumore; Stazioni da provare
          F="$HOME/.local/share/YAEC/data/impostazioni.txt"
          cp "$F" /tmp/imp0.bak
          printf 'orizzonte_raggio=2\norizzonte_vista=0\n' >> "$F"
          YAEC_LINGUETTA="Il mio orizzonte" YAEC_ORIZZONTE=1 mono YAEC.exe &
          PID=$!
          sleep 240
          import -window root shot/o.png || true
          convert shot/o.png -resize 1400x shot/o.jpg 2>/dev/null && echo "SCREENSHOT-ORIZZONTE-B64:$(base64 -w 0 shot/o.jpg)" || true
          kill $PID 2>/dev/null || true
          ls -la "$HOME/.local/share/YAEC/data/dem" | head -20 || true
          head -20 "$HOME/.local/share/YAEC/data/dem/orizzonte.txt" 2>/dev/null || true
          printf 'orizzonte_vista=1\n' >> "$F"
          YAEC_LINGUETTA="Il mio orizzonte" mono YAEC.exe &
          PID=$!
          sleep 30
          import -window root shot/r.png || true
          convert shot/r.png -resize 1400x shot/r.jpg 2>/dev/null && echo "SCREENSHOT-RUMORE-B64:$(base64 -w 0 shot/r.jpg)" || true
          kill $PID 2>/dev/null || true
          YAEC_LINGUETTA="Stazioni da provare" mono YAEC.exe &
          PID=$!
          sleep 40
          import -window root shot/p.png || true
          convert shot/p.png -resize 1400x shot/p.jpg 2>/dev/null && echo "SCREENSHOT-PROVARE-B64:$(base64 -w 0 shot/p.jpg)" || true
          kill $PID 2>/dev/null || true
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
          cp /tmp/imp0.bak "$F"
          # Volta celeste con limiti dell'antenna (az 285 -> 80, el 0 -> 12): riquadri viola della zona puntabile
          F="$HOME/.local/share/YAEC/data/impostazioni.txt"
          cp "$F" /tmp/imp.bak
          sed -i '/^az1=/d;/^az2=/d;/^el1=/d;/^el2=/d' "$F"; printf 'az1=285\naz2=80\nel1=0\nel2=12\n' >> "$F"
          YAEC_LINGUETTA="Volta celeste" mono YAEC.exe &
          PID=$!
          sleep 30
          import -window root shot/v.png || true
          convert shot/v.png -resize 1400x shot/v.jpg 2>/dev/null && echo "SCREENSHOT-VOLTA-B64:$(base64 -w 0 shot/v.jpg)" || true
          kill $PID 2>/dev/null || true
          cp /tmp/imp.bak "$F"
          # finestra di chiusura (pulsanti Si'/No) in italiano, inglese ed ebraico
          for LG in it en he; do
            sed -i '/^lingua=/d' "$F"; echo "lingua=$LG" >> "$F"
            YAEC_CHIUSURA=1 mono YAEC.exe &
            PID=$!
            sleep 30
            import -window root shot/c.png || true
            convert shot/c.png -trim +repage shot/c.jpg 2>/dev/null && echo "SCREENSHOT-CHIUSURA-$LG-B64:$(base64 -w 0 shot/c.jpg)" || true
            kill $PID 2>/dev/null || true
          done
          cp /tmp/imp.bak "$F"
          # lingue nuove e schema pastello rosa: schermata principale in ebraico, urdu e olandese
          sed -i '/^tema=/d' "$HOME/.local/share/YAEC/data/impostazioni.txt"; echo "tema=pastello-rosa" >> "$HOME/.local/share/YAEC/data/impostazioni.txt"
          for LG in he ur nl; do
            sed -i '/^lingua=/d' "$HOME/.local/share/YAEC/data/impostazioni.txt"; echo "lingua=$LG" >> "$HOME/.local/share/YAEC/data/impostazioni.txt"
            mono YAEC.exe &
            PID=$!
            sleep 30
            import -window root shot/l.png || true
            convert shot/l.png -resize 1200x shot/l.jpg 2>/dev/null && echo "SCREENSHOT-LANG-$LG-B64:$(base64 -w 0 shot/l.jpg)" || true
            kill $PID 2>/dev/null || true
          done
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
      - name: Schermate del README in tutte le lingue (solo con [readme] nel messaggio del commit)
        if: contains(github.event.head_commit.message, '[readme]')
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-core > /dev/null 2>&1 || true
          fc-cache -f > /dev/null
          Xvfb :96 -screen 0 1600x1000x24 &
          export DISPLAY=:96
          sleep 2
          F="$HOME/.local/share/YAEC/data/impostazioni.txt"
          mkdir -p shotr
          while IFS='|' read -r LG T2 T3; do
            printf 'lingua=%s\nlocator=JN70CN83CL\ndx=1\ndx_locator=BL20BB\ndx_nominativo=W7GJ\n' "$LG" > "$F"
            N=1
            for T in "" "$T2" "$T3"; do
              if [ -z "$T" ]; then mono YAEC.exe & else YAEC_LINGUETTA="$T" mono YAEC.exe & fi
              PID=$!
              sleep 35
              import -window root shotr/x.png || true
              convert shotr/x.png -trim +repage -quality 85 shotr/x.jpg 2>/dev/null && echo "SCREENSHOT-README-$LG-$N-B64:$(base64 -w 0 shotr/x.jpg)" || true
              kill $PID 2>/dev/null || true; sleep 2
              N=$((N+1))
            done
          done <<'EOF'
          it|Budget EME yagi|Distanza e Dgrd
          en|EME budget Yagi|Distance and Dgrd
          de|EME-Budget Yagi|Entfernung und Dgrd
          fr|Bilan EME Yagi|Distance et Dgrd
          es|Balance EME Yagi|Distancia y Dgrd
          pt|Balanço EME Yagi|Distância e Dgrd
          tr|EME bütçesi yagi|Mesafe ve Dgrd
          cs|Bilance EME yagi|Vzdálenost a Dgrd
          sk|Bilancia EME yagi|Vzdialenosť a Dgrd
          zh|EME 链路预算 八木|距离与 Dgrd
          ja|EME 回線計算 八木|距離と Dgrd
          EOF
      - name: Prova dei caratteri consigliati, linguetta per linguetta (solo con [caratteri] nel messaggio del commit)
        if: contains(github.event.head_commit.message, '[caratteri]')
        run: |
          for P in fonts-noto-core fonts-crosextra-carlito fonts-liberation fonts-ubuntu fonts-cantarell fonts-open-sans fonts-roboto fonts-firacode fonts-fira-sans fonts-adobe-sourcesans3 fonts-freefont-ttf; do sudo apt-get install -y -qq $P > /dev/null 2>&1 && echo "installato $P" || echo "non disponibile $P"; done
          fc-cache -f > /dev/null
          Xvfb :97 -screen 0 1600x1000x24 &
          export DISPLAY=:97
          sleep 2
          F="$HOME/.local/share/YAEC/data/impostazioni.txt"
          printf 'lingua=it\nlocator=JN70CN83CL\ndx=1\ndx_locator=BL20BB\ndx_nominativo=IC8TEM\ncomplessi=1\n' > "$F"
          mkdir -p caratteri
          for FN in "Noto Sans" "Carlito" "Liberation Sans" "Ubuntu" "Cantarell" "Open Sans" "Roboto" "Fira Sans" "Source Sans 3" "FreeSans"; do
            if ! fc-list : family | tr ',' '\n' | grep -qx "$FN"; then echo "CARATTERE-ASSENTE: $FN"; continue; fi
            sed -i '/^font_nome=/d' "$F"; echo "font_nome=$FN" >> "$F"
            G=$(mktemp -d); D="caratteri/${FN// /_}"; mkdir -p "$D"
            YAEC_GIRO="$G" mono YAEC.exe &
            PID=$!
            for i in $(seq 0 16); do
              k=0; while [ ! -f "$G/$i.txt" ] && [ ! -f "$G/fine" ] && [ $k -lt 120 ]; do sleep 1; k=$((k+1)); done
              [ -f "$G/$i.txt" ] || break
              import -window root png:- | convert - -quality 82 "$D/$(printf %02d $i)-$(tr ' /' '__' < $G/$i.txt).jpg" || true
              touch "$G/ok$i"
            done
            kill $PID 2>/dev/null || true; sleep 2
            echo "CARATTERE-PROVATO: $FN $(ls $D | wc -l) linguette"
          done
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
      - name: Schermate dei caratteri nel ramo prova-caratteri
        if: contains(github.event.head_commit.message, '[caratteri]')
        run: |
          set -e
          H=$(git config --get http.https://github.com/.extraheader)
          U=$(git remote get-url origin)
          cd caratteri
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Font test ${GITHUB_SHA::7}"
          git -c http.https://github.com/.extraheader="$H" push -qf "$U" HEAD:prova-caratteri
      - name: Schermate per gli articoli (solo con [articolo] nel messaggio del commit)
        if: contains(github.event.head_commit.message, '[articolo]') || github.event.inputs.articolo == 'true'
        run: |
          sudo apt-get install -y -qq xdotool fonts-noto-core faketime > /dev/null 2>&1 || true
          fc-cache -f > /dev/null
          Xvfb :95 -screen 0 1920x1080x24 &
          export DISPLAY=:95
          sleep 2
          F="$HOME/.local/share/YAEC/data/impostazioni.txt"
          {
            printf 'lingua=it\ntema=0\nfont_nome=Noto Sans\ncomplessi=1\nbanda=144\nfreq=144.120\n'
            printf 'locator=JN81MA\nquota=50\ndx=1\ndx_locator=BL20BB\ndx_quota=50\ndx_nominativo=\n'
            printf 'b144_me_p=500\nb144_me_nant=2\nb144_me_gant=14\nb144_me_pregain=10\nb144_me_tvon=0\nb144_me_lenant=1\nb144_me_lenpa=20\nb144_me_lendis=20\n'
            printf 'b144_dx_p=900\nb144_dx_nant=4\nb144_dx_gant=15.4\nb144_dx_pregain=25\nb144_dx_tvon=0\nb144_dx_lenant=1\nb144_dx_lenpa=30\nb144_dx_lendis=30\n'
          } > "$F"
          mkdir -p articolo
          i=0
          scatta() {  # $1 = linguetta, $2 = nome del file, $3 = attesa in secondi, altre variabili gia' esportate
            YAEC_LINGUETTA="$1" TZ=Europe/Rome faketime -f "@2026-11-25 06:14:00" mono YAEC.exe &
            PID=$!
            sleep 25
            W=$(xdotool search --name "YAEC" | tail -1)
            if [ -n "$W" ]; then xdotool windowmove $W 0 0 windowsize $W 1920 1080; fi
            sleep "$3"; xdotool mousemove 1915 1075 || true; sleep 1
            import -window root "articolo/$2.png" || true
            kill $PID 2>/dev/null || true; pkill -f YAEC.exe || true; sleep 3
          }
          export YAEC_CALCOLA=1
          scatta "Posizione live e +- 24h" 01-principale 12
          scatta "Distanza e Dgrd" 02-distanza_dgrd 20
          scatta "Posizione della Luna" 03-posizione 15
          scatta "Budget EME yagi" 04-budget_yagi 12
          # «Stazioni da provare» dalla stazione di Bari JN81MA: 2 x 11 elementi (14,5 dBi DL6WU), 500 W
          sed -i '/^b144_me_gant=/d' "$F"; printf 'b144_me_gant=14.5\n' >> "$F"
          scatta "Stazioni da provare" 06-stazioni_da_provare 40
          unset YAEC_CALCOLA
          # la stazione dell'autore a Capri per «Il mio orizzonte» e «Stazioni da provare»
          {
            printf 'lingua=it\ntema=0\nfont_nome=Noto Sans\ncomplessi=1\nbanda=144\nfreq=144.120\n'
            printf 'locator=JN70CN83CL\nquota=62\ndx=1\ndx_locator=BL20BB\ndx_quota=50\ndx_nominativo=\n'
            printf 'orizzonte_raggio=2\norizzonte_vista=0\nterreno=1\n'
            printf 'b144_me_p=1000\nb144_me_nant=4\nb144_me_gant=17\n'
          } > "$F"
          YAEC_ORIZZONTE=1 scatta "Il mio orizzonte" 05-orizzonte 240
          printf 'orizzonte_vista=1\n' >> "$F"
          scatta "Il mio orizzonte" 07-rumore_locale 20
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
          H=$(git config --get http.https://github.com/.extraheader)
          U=$(git remote get-url origin)
          cd articolo
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Article screenshots ${GITHUB_SHA::7}"
          git -c http.https://github.com/.extraheader="$H" push -qf "$U" HEAD:articolo
      - name: Schermate per il README (solo con [schermate] nel messaggio del commit)
        if: contains(github.event.head_commit.message, '[schermate]')
        run: |
          Xvfb :98 -screen 0 1600x1000x24 &
          export DISPLAY=:98
          sleep 2
          mkdir -p readme
          F="$HOME/.local/share/YAEC/data/impostazioni.txt"
          printf 'locator=JN70CN83CL\ndx=1\ndx_locator=BL20BB\ndx_nominativo=W7GJ\n' > "$F"
          while IFS='|' read -r L N T; do
            sed -i '/^lingua=/d' "$F"; echo "lingua=$L" >> "$F"
            YAEC_LINGUETTA="$T" mono YAEC.exe &
            PID=$!
            sleep 35
            import -window root readme/x.png || true
            convert readme/x.png -trim +repage -quality 88 "readme/$L-$N.jpg" 2>/dev/null || true
            echo "README-SHOT-$L-$N-B64:$(base64 -w 0 readme/$L-$N.jpg)"
            kill $PID 2>/dev/null || true
            sleep 2
          done <<'ELENCO'
          it|1|Posizione live e +- 24h
          it|2|Budget EME
          it|3|Distanza e Dgrd
          en|1|Live position and +- 24h
          en|2|EME budget
          en|3|Distance and Dgrd
          de|1|Position live und +- 24h
          de|2|EME-Budget
          de|3|Entfernung und Dgrd
          fr|1|Position en direct et +- 24h
          fr|2|Bilan EME
          fr|3|Distance et Dgrd
          es|1|Posición en vivo y +- 24h
          es|2|Balance EME
          es|3|Distancia y Dgrd
          ELENCO
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot
          path: shot/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  raspberry:
    # Raspberry Pi OS (64 bit) è Debian per ARM: si installa lo stesso pacchetto .deb e si prova l'avvio su ARM64
    needs: linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Installazione del .deb su ARM64 e prova di avvio
        run: |
          uname -m
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/yaec_*_arm64.deb xvfb imagemagick fonts-dejavu-core > /dev/null
          mkdir -p "$HOME/.local/share/YAEC/data"
          printf 'lingua=it\nlocator=JN70CN83CL\ndx=1\ndx_locator=BL20BB\ndx_nominativo=IC8TEM\n' > "$HOME/.local/share/YAEC/data/impostazioni.txt"
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99
          sleep 2
          L=$(command -v yaec || ls /usr/bin/yaec* /usr/games/yaec* 2>/dev/null | head -1)
          echo "avvio: $L"
          $L &
          PID=$!
          sleep 90
          import -window root r.png || true
          convert r.png -resize 1200x r.jpg 2>/dev/null && echo "SCREENSHOT-ARM64-B64:$(base64 -w 0 r.jpg)" || true
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
          if kill -0 $PID 2>/dev/null; then echo "YAEC in esecuzione su ARM64 dopo 90 s: avvio riuscito"; kill $PID; else echo "YAEC si e' chiuso su ARM64"; exit 1; fi

  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: win
      - name: Versione
        id: ver
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: YAEC.app e .dmg
        run: |
          cp win/YAEC.exe .
          packaging/macos/build-macos.sh "${{ steps.ver.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ windows, linux, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Crea la release (se questa versione non ce l'ha ancora)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          TAG="v${V}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "La release $TAG esiste gia'."; exit 0; fi
          rm -f out/windows/YAEC.exe
          # impronte SHA-256 di tutti i pacchetti
          ( cd out && for f in windows/* linux/* macos/*; do sha256sum "$f" | sed 's|  .*/|  |'; done ) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<NOTES
          YAEC - Yet Another EME Calc ${V}, a cura di Costantino IC8TEM.

          - **Windows su ARM64** (PC con Snapdragon): YAEC-${V}-win-arm64-setup.exe oppure YAEC-${V}-win-arm64-portatile.zip.
          - **Fedora, openSUSE**: yaec-${V}-1.noarch.rpm (con Mono); **Raspberry Pi OS a 32 bit**: yaec_${V}_armhf.deb; **OpenBSD amd64** (con Mono, non ancora provato): YAEC-${V}-openbsd-x64-portatile.tar.gz.
          - **Windows a 64 bit**: YAEC-${V}-win-x64-setup.exe (installatore) oppure YAEC-${V}-win-x64-portatile.zip; **Windows a 32 bit**: YAEC-${V}-win-x86-setup.exe oppure YAEC-${V}-win-x86-portatile.zip.
          - **Linux (Debian, Ubuntu, Mint)**: yaec_${V}_amd64.deb (sudo apt install ./yaec_${V}_amd64.deb); **Raspberry Pi** (Raspberry Pi OS a 64 bit, Pi 4 e 5): yaec_${V}_arm64.deb.
          - **Linux, tutte le distribuzioni (con Mono)**: YAEC-${V}-linux-x64-portatile.tar.gz (PC), YAEC-${V}-linux-arm64-portatile.tar.gz (ARM a 64 bit), YAEC-${V}-linux-arm-portatile.tar.gz (ARM a 32 bit, armv7l), YAEC-${V}-linux-x86-portatile.tar.gz (Linux i686, non ancora provato); Raspberry Pi Slackware ARM64: YAEC-${V}-linux-arm64-portatile.tar.gz (non ancora provato).
          - **FreeBSD amd64** (con Mono, non ancora provato): YAEC-${V}-freebsd-x64-portatile.tar.gz.
          - **macOS** (sperimentale; servono Mono e XQuartz): YAEC-${V}-osx-arm64.dmg oppure YAEC-${V}-osx-arm64-app.zip (Apple Silicon), YAEC-${V}-osx-x64.dmg oppure YAEC-${V}-osx-x64-app.zip (Intel).

          Impronte SHA-256 di tutti i file in SHA256SUMS.txt (come verificarle: README.txt).

          Le versioni precedenti alla 1.0 si chiamano beta. Dettagli nel file README.txt.
          NOTES
          gh release create "$TAG" out/windows/* out/linux/* out/macos/* SHA256SUMS.txt --target "$GITHUB_SHA" --title "YAEC ${V}" --notes-file notes.md

  aggiungi:
    # Avvio manuale con aggiungi_pacchetti: carica sulla release esistente solo i pacchetti che non ha ancora
    if: github.event_name == 'workflow_dispatch' && inputs.aggiungi_pacchetti
    needs: [ windows, linux, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Carica i pacchetti mancanti e aggiorna SHA256SUMS.txt e le note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          TAG="v${V}"
          gh release view "$TAG" > /dev/null
          gh release view "$TAG" --json assets -q '.assets[].name' | sort > presenti.txt
          rm -f out/windows/YAEC.exe
          NUOVI=()
          for f in out/windows/* out/linux/* out/macos/*; do
            n="$(basename "$f")"
            grep -qxF "$n" presenti.txt || NUOVI+=("$f")
          done
          if [ ${#NUOVI[@]} -eq 0 ]; then echo "Nessun pacchetto nuovo."; exit 0; fi
          printf 'Nuovi: %s\n' "${NUOVI[@]}"
          gh release download "$TAG" -p SHA256SUMS.txt -O SHA256SUMS.txt --clobber
          for f in "${NUOVI[@]}"; do sha256sum "$f" | sed 's|  .*/|  |' >> SHA256SUMS.txt; done
          cat SHA256SUMS.txt
          gh release upload "$TAG" "${NUOVI[@]}"
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release view "$TAG" --json body -q .body > note.md
          {
            echo
            echo "**Pacchetti aggiunti dopo la pubblicazione** (stesso programma ${V}):"
            for f in "${NUOVI[@]}"; do echo "- $(basename "$f")"; done
          } >> note.md
          gh release edit "$TAG" --notes-file note.md
