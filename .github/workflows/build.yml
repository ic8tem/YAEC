name: Build YAEC

# Ogni push compila il programma su Windows e lo prova su Linux con Mono.
# La versione sta nel file VERSION: quando su main arriva una versione che non ha
# ancora la sua release (tag vX.Y), la crea con l'installatore per Windows e i
# pacchetti per Linux e macOS.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        id: ver
        shell: bash
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Compila YAEC.exe (csc di .NET Framework 4, C# 5)
        shell: cmd
        run: build.cmd
      - name: Installatore (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" YAEC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pacchetto portatile e sorgenti
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item "YAEC-$v-Setup.exe" dist/
          Compress-Archive -Path YAEC.exe, YAEC.ico, README.txt, LICENZA.txt -DestinationPath "dist/YAEC-$v-windows-portable.zip"
          Compress-Archive -Path YAEC.cs, compila.bat, YAEC.manifest, YAEC.ico, README.txt, YAEC.iss, LICENZA.txt -DestinationPath "dist/YAEC-$v-source.zip"
          Copy-Item YAEC.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: win
      - name: Versione
        id: ver
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Verifica delle fonti di CALL3.TXT (solo informativa)
        continue-on-error: true
        run: |
          for u in "http://www.bigskyspaces.com/w7gj/CALL3.TXT" "http://www.bigskyspaces.com/w7gj/call3.txt" \
                   "https://downloads.sourceforge.net/project/wsjt-x-improved/Additional%20Files/CALL3.TXT" \
                   "https://sourceforge.net/projects/wsjt-x-improved/files/Additional%20Files/CALL3.TXT/download"; do
            code=$(curl -sSL -A "YAEC-CI" -m 30 -o c3.tmp -w "%{http_code}" "$u" || echo ERR)
            echo "CALL3 $code $(wc -c < c3.tmp 2>/dev/null) bytes, righe valide $(grep -cE '^[A-Z0-9/]+,[A-R]{2}[0-9]{2}' c3.tmp 2>/dev/null) :: $u"
            head -c 300 c3.tmp | tr -d '\r' | head -4; echo
          done
          curl -sSL -m 30 http://www.bigskyspaces.com/w7gj/ | grep -io 'href="[^"]*call3[^"]*"' | head || true
          curl -sSL -m 30 http://www.bigskyspaces.com/w7gj/tracker.htm | grep -io 'href="[^"]*\.txt"' | head || true
      - name: Pacchetti .deb e .tar.gz
        run: |
          cp win/YAEC.exe .
          packaging/linux/build-linux.sh "${{ steps.ver.outputs.version }}" dist
      - name: Prova di avvio con Mono (schermo virtuale Xvfb) e schermata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-runtime libmono-system-windows-forms4.0-cil libmono-system-web-extensions4.0-cil libmono-system-security4.0-cil libmono-system-io-compression-filesystem4.0-cil libgdiplus xvfb imagemagick fonts-dejavu-core > /dev/null
          # impostazioni di prova: stazione IC8TEM a Capri e un DX, lingua italiana
          mkdir -p "$HOME/.local/share/YAEC/data"
          printf 'lingua=it\nlocator=JN70CN83CL\ndx=1\ndx_locator=BL20BB\n' > "$HOME/.local/share/YAEC/data/impostazioni.txt"
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99
          sleep 2
          mono YAEC.exe &
          PID=$!
          sleep 45
          mkdir -p shot
          import -window root shot/YAEC-linux-mono.png || true
          convert shot/YAEC-linux-mono.png -resize 1200x shot/small.jpg 2>/dev/null && echo "SCREENSHOT-B64:$(base64 -w 0 shot/small.jpg)" || true
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
          if kill -0 $PID 2>/dev/null; then echo "YAEC in esecuzione dopo 45 s: avvio riuscito"; kill $PID; else echo "YAEC si e' chiuso"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot
          path: shot/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: win
      - name: Versione
        id: ver
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: YAEC.app e .dmg
        run: |
          cp win/YAEC.exe .
          packaging/macos/build-macos.sh "${{ steps.ver.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ windows, linux, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Crea la release (se questa versione non ce l'ha ancora)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          TAG="v${V}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "La release $TAG esiste gia'."; exit 0; fi
          rm -f out/windows/YAEC.exe
          # impronte SHA-256 di tutti i pacchetti
          ( cd out && for f in windows/* linux/* macos/*; do sha256sum "$f" | sed 's|  .*/|  |'; done ) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<NOTES
          YAEC - Yet Another EME Calc ${V}, a cura di Costantino IC8TEM.

          - **Windows**: YAEC-${V}-Setup.exe (installatore) oppure YAEC-${V}-windows-portable.zip.
          - **Linux**: yaec_${V}_all.deb (Debian, Ubuntu, Mint: sudo apt install ./yaec_${V}_all.deb) oppure YAEC-${V}-linux.tar.gz (tutte le distribuzioni, con Mono).
          - **macOS** (sperimentale): YAEC-${V}-macOS.dmg; servono Mono e XQuartz.

          Impronte SHA-256 di tutti i file in SHA256SUMS.txt (come verificarle: README.txt).

          Le versioni precedenti alla 1.0 si chiamano beta. Dettagli nel file README.txt.
          NOTES
          gh release create "$TAG" out/windows/* out/linux/* out/macos/* SHA256SUMS.txt --target "$GITHUB_SHA" --title "YAEC ${V}" --notes-file notes.md
