name: Build YAEC

# Ogni push compila il programma su Windows e lo prova su Linux con Mono.
# La versione sta nel file VERSION: quando su main arriva una versione che non ha
# ancora la sua release (tag vX.Y), la crea con l'installatore per Windows e i
# pacchetti per Linux e macOS.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        id: ver
        shell: bash
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Compila YAEC.exe (csc di .NET Framework 4, C# 5)
        shell: cmd
        run: build.cmd
      - name: Installatore (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" YAEC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pacchetto portatile e sorgenti
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item "YAEC-$v-Setup.exe" dist/
          Compress-Archive -Path YAEC.exe, YAEC.ico, README.txt, LICENZA.txt -DestinationPath "dist/YAEC-$v-windows-portable.zip"
          Compress-Archive -Path YAEC.cs, compila.bat, YAEC.manifest, YAEC.ico, README.txt, YAEC.iss, LICENZA.txt -DestinationPath "dist/YAEC-$v-source.zip"
          Copy-Item YAEC.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: win
      - name: Versione
        id: ver
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Verifica delle fonti di CALL3.TXT (solo informativa)
        continue-on-error: true
        run: |
          for u in "http://www.bigskyspaces.com/w7gj/CALL3.TXT" "http://www.bigskyspaces.com/w7gj/call3.txt" \
                   "https://downloads.sourceforge.net/project/wsjt-x-improved/Additional%20Files/CALL3.TXT" \
                   "https://sourceforge.net/projects/wsjt-x-improved/files/Additional%20Files/CALL3.TXT/download"; do
            code=$(curl -sSL -A "YAEC-CI" -m 30 -o c3.tmp -w "%{http_code}" "$u" || echo ERR)
            echo "CALL3 $code $(wc -c < c3.tmp 2>/dev/null) bytes, righe valide $(grep -cE '^[A-Z0-9/]+,[A-R]{2}[0-9]{2}' c3.tmp 2>/dev/null) :: $u"
            head -c 300 c3.tmp | tr -d '\r' | head -4; echo
          done
          curl -sSL -m 30 http://www.bigskyspaces.com/w7gj/ | grep -io 'href="[^"]*call3[^"]*"' | head || true
          curl -sSL -m 30 http://www.bigskyspaces.com/w7gj/tracker.htm | grep -io 'href="[^"]*\.txt"' | head || true
      - name: Pacchetti .deb e .tar.gz
        run: |
          cp win/YAEC.exe .
          packaging/linux/build-linux.sh "${{ steps.ver.outputs.version }}" dist
      - name: Prova di avvio con Mono (schermo virtuale Xvfb) e schermata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-runtime libmono-system-windows-forms4.0-cil libmono-system-web-extensions4.0-cil libmono-system-security4.0-cil libmono-system-io-compression-filesystem4.0-cil libgdiplus xvfb imagemagick fonts-dejavu-core > /dev/null
          # impostazioni di prova: stazione IC8TEM a Capri e un DX, lingua italiana
          mkdir -p "$HOME/.local/share/YAEC/data"
          printf 'lingua=it\nlocator=JN70CN83CL\ndx=1\ndx_locator=BL20BB\ndx_nominativo=W7GJ\n' > "$HOME/.local/share/YAEC/data/impostazioni.txt"
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99
          sleep 2
          mono YAEC.exe &
          PID=$!
          sleep 90
          mkdir -p shot
          import -window root shot/YAEC-linux-mono.png || true
          convert shot/YAEC-linux-mono.png -resize 1200x shot/small.jpg 2>/dev/null && echo "SCREENSHOT-B64:$(base64 -w 0 shot/small.jpg)" || true
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
          if kill -0 $PID 2>/dev/null; then echo "YAEC in esecuzione dopo 90 s: avvio riuscito"; kill $PID; else echo "YAEC si e' chiuso"; exit 1; fi
          # seconda schermata: linguetta Distanza e Dgrd (e CALL3.TXT ormai scaricato)
          ls -la "$HOME/.local/share/YAEC/data" || true
          apt-cache search mono | grep -iE "cert|mono-devel|mono-complete" | head || true
          which cert-sync mozroots || true
          mono --version | head -1 || true
          head -c 200 "$HOME/.local/share/YAEC/data/solar-radio-flux.json" 2>/dev/null || echo "solar-radio-flux.json assente"; echo
          head -5 "$HOME/.local/share/YAEC/data/CALL3.TXT" 2>/dev/null || true
          YAEC_LINGUETTA="Distanza e Dgrd" mono YAEC.exe &
          PID=$!
          sleep 40
          import -window root shot/YAEC-dgrd.png || true
          convert shot/YAEC-dgrd.png -resize 1200x shot/small2.jpg 2>/dev/null && echo "SCREENSHOT2-B64:$(base64 -w 0 shot/small2.jpg)" || true
          kill $PID 2>/dev/null || true
          # terza schermata: TEORIA E CONSIGLI SULL'EME (prefazione e numerazione)
          YAEC_LINGUETTA="TEORIA E CONSIGLI SULL'EME" mono YAEC.exe &
          PID=$!
          sleep 35
          import -window root shot/YAEC-teoria.png || true
          convert shot/YAEC-teoria.png -resize 1200x shot/small3.jpg 2>/dev/null && echo "SCREENSHOT3-B64:$(base64 -w 0 shot/small3.jpg)" || true
          kill $PID 2>/dev/null || true
          # Bilan EME in francese (testi lunghi nello schema dell'impianto)
          sed -i 's/^lingua=it/lingua=fr/' "$HOME/.local/share/YAEC/data/impostazioni.txt"
          YAEC_LINGUETTA="Bilan EME" mono YAEC.exe &
          PID=$!
          sleep 30
          import -window root shot/fr.png || true
          convert shot/fr.png -resize 1200x shot/fr.jpg 2>/dev/null && echo "SCREENSHOT-FR-B64:$(base64 -w 0 shot/fr.jpg)" || true
          kill $PID 2>/dev/null || true
          sed -i 's/^lingua=fr/lingua=es/' "$HOME/.local/share/YAEC/data/impostazioni.txt"
          YAEC_LINGUETTA="TEORÍA Y CONSEJOS SOBRE EME" mono YAEC.exe &
          PID=$!
          sleep 30
          import -window root shot/es.png || true
          convert shot/es.png -resize 1200x shot/es.jpg 2>/dev/null && echo "SCREENSHOT-ES-B64:$(base64 -w 0 shot/es.jpg)" || true
          kill $PID 2>/dev/null || true
          sed -i 's/^lingua=es/lingua=it/' "$HOME/.local/share/YAEC/data/impostazioni.txt"
          for C in "Verificare il puntamento con il radar GRAVES" "Le impostazioni di NJ9R per JT65B" "Le chat testuali via Internet"; do
            YAEC_LINGUETTA="TEORIA E CONSIGLI SULL'EME" YAEC_CERCA="$C" mono YAEC.exe &
            PID=$!
            sleep 30
            import -window root shot/c.png || true
            convert shot/c.png -resize 1200x shot/c.jpg 2>/dev/null && echo "SCREENSHOT-CERCA-B64:$(base64 -w 0 shot/c.jpg)" || true
            kill $PID 2>/dev/null || true
          done
          echo "tema=pastello-azzurro" >> "$HOME/.local/share/YAEC/data/impostazioni.txt"
          YAEC_LINGUETTA="CONTATTI DELL'AUTORE E RINGRAZIAMENTI" YAEC_FONDO=1 mono YAEC.exe &
          PID=$!
          sleep 30
          import -window root shot/f.png || true
          convert shot/f.png -resize 1200x shot/f.jpg 2>/dev/null && echo "SCREENSHOT-FONDO-B64:$(base64 -w 0 shot/f.jpg)" || true
          kill $PID 2>/dev/null || true
          for T in "MANUALE D'USO" "Budget EME"; do
            YAEC_LINGUETTA="$T" mono YAEC.exe &
            PID=$!
            sleep 30
            import -window root shot/x.png || true
            convert shot/x.png -resize 1200x shot/x.jpg 2>/dev/null && echo "SCREENSHOT-${T// /_}-B64:$(base64 -w 0 shot/x.jpg)" || true
            kill $PID 2>/dev/null || true
          done
          if [ -f "$HOME/.local/share/YAEC/data/errori.txt" ]; then echo "---- errori.txt ----"; cat "$HOME/.local/share/YAEC/data/errori.txt"; fi
      - name: Schermate per il README (solo con [schermate] nel messaggio del commit)
        if: contains(github.event.head_commit.message, '[schermate]')
        run: |
          Xvfb :98 -screen 0 1600x1000x24 &
          export DISPLAY=:98
          sleep 2
          mkdir -p readme
          F="$HOME/.local/share/YAEC/data/impostazioni.txt"
          printf 'locator=JN70CN83CL\ndx=1\ndx_locator=BL20BB\ndx_nominativo=W7GJ\n' > "$F"
          while IFS='|' read -r L N T; do
            sed -i '/^lingua=/d' "$F"; echo "lingua=$L" >> "$F"
            YAEC_LINGUETTA="$T" mono YAEC.exe &
            PID=$!
            sleep 35
            import -window root readme/x.png || true
            convert readme/x.png -trim +repage -quality 88 "readme/$L-$N.jpg" 2>/dev/null || true
            echo "README-SHOT-$L-$N-B64:$(base64 -w 0 readme/$L-$N.jpg)"
            kill $PID 2>/dev/null || true
            sleep 2
          done <<'ELENCO'
          it|1|Posizione live e +- 24h
          it|2|Budget EME
          it|3|Distanza e Dgrd
          en|1|Live position and +- 24h
          en|2|EME budget
          en|3|Distance and Dgrd
          de|1|Position live und +- 24h
          de|2|EME-Budget
          de|3|Entfernung und Dgrd
          fr|1|Position en direct et +- 24h
          fr|2|Bilan EME
          fr|3|Distance et Dgrd
          es|1|Posición en vivo y +- 24h
          es|2|Balance EME
          es|3|Distancia y Dgrd
          ELENCO
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot
          path: shot/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: win
      - name: Versione
        id: ver
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: YAEC.app e .dmg
        run: |
          cp win/YAEC.exe .
          packaging/macos/build-macos.sh "${{ steps.ver.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ windows, linux, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Crea la release (se questa versione non ce l'ha ancora)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          TAG="v${V}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "La release $TAG esiste gia'."; exit 0; fi
          rm -f out/windows/YAEC.exe
          # impronte SHA-256 di tutti i pacchetti
          ( cd out && for f in windows/* linux/* macos/*; do sha256sum "$f" | sed 's|  .*/|  |'; done ) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<NOTES
          YAEC - Yet Another EME Calc ${V}, a cura di Costantino IC8TEM.

          - **Windows**: YAEC-${V}-Setup.exe (installatore) oppure YAEC-${V}-windows-portable.zip.
          - **Linux**: yaec_${V}_all.deb (Debian, Ubuntu, Mint: sudo apt install ./yaec_${V}_all.deb) oppure YAEC-${V}-linux.tar.gz (tutte le distribuzioni, con Mono).
          - **macOS** (sperimentale): YAEC-${V}-macOS.dmg; servono Mono e XQuartz.

          Impronte SHA-256 di tutti i file in SHA256SUMS.txt (come verificarle: README.txt).

          Le versioni precedenti alla 1.0 si chiamano beta. Dettagli nel file README.txt.
          NOTES
          gh release create "$TAG" out/windows/* out/linux/* out/macos/* SHA256SUMS.txt --target "$GITHUB_SHA" --title "YAEC ${V}" --notes-file notes.md
